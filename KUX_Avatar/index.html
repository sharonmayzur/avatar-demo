    <!-- Step 1: Intercept CSS variable writes BEFORE the app JS runs -->
    <script>
      (function () {
        const BLACK = '#000000';
        const DARK_RED = '#8b0000';   // dark red for all focus/hover states

        // Override setProperty so any variable the app tries to set gets our version instead
        const nativeSetProperty = CSSStyleDeclaration.prototype.setProperty;
        CSSStyleDeclaration.prototype.setProperty = function (name, value, priority) {
          if (name === '--background-color' ||
              name === '--background-color-h' ||
              name === '--background-color-s' ||
              name === '--background-color-l') {
            // Force black: hsl(0, 0%, 0%)
            if (name === '--background-color') return nativeSetProperty.call(this, name, BLACK, 'important');
            if (name === '--background-color-h') return nativeSetProperty.call(this, name, '0', 'important');
            if (name === '--background-color-s') return nativeSetProperty.call(this, name, '0%', 'important');
            if (name === '--background-color-l') return nativeSetProperty.call(this, name, '0%', 'important');
          }
          if (name === '--focus-color' ||
              name === '--focus-color-h' ||
              name === '--focus-color-s' ||
              name === '--focus-color-l') {
            // Force dark red: hsl(0, 100%, 27%)
            if (name === '--focus-color') return nativeSetProperty.call(this, name, DARK_RED, 'important');
            if (name === '--focus-color-h') return nativeSetProperty.call(this, name, '0', 'important');
            if (name === '--focus-color-s') return nativeSetProperty.call(this, name, '100%', 'important');
            if (name === '--focus-color-l') return nativeSetProperty.call(this, name, '27%', 'important');
          }
          return nativeSetProperty.call(this, name, value, priority);
        };

        // Also set them immediately so they're ready before React hydrates
        document.addEventListener('DOMContentLoaded', function () {
          const s = document.documentElement.style;
          nativeSetProperty.call(s, '--background-color', BLACK, 'important');
          nativeSetProperty.call(s, '--background-color-h', '0', 'important');
          nativeSetProperty.call(s, '--background-color-s', '0%', 'important');
          nativeSetProperty.call(s, '--background-color-l', '0%', 'important');
          nativeSetProperty.call(s, '--focus-color', DARK_RED, 'important');
          nativeSetProperty.call(s, '--focus-color-h', '0', 'important');
          nativeSetProperty.call(s, '--focus-color-s', '100%', 'important');
          nativeSetProperty.call(s, '--focus-color-l', '27%', 'important');
        });
      })();
    </script>

    <!-- Step 2: Hard CSS overrides as a safety net -->

    <!-- Step 3: Aggressive JS fallback — reapply variables after app hydration -->
    <script>
      (function () {
        const BLACK = '#000000';
        const DARK_RED = '#8b0000';
        function forceVars() {
          const s = document.documentElement.style;
          const nsp = CSSStyleDeclaration.prototype.setProperty;
          nsp.call(s, '--background-color', BLACK, 'important');
          nsp.call(s, '--background-color-h', '0', 'important');
          nsp.call(s, '--background-color-s', '0%', 'important');
          nsp.call(s, '--background-color-l', '0%', 'important');
          nsp.call(s, '--focus-color', DARK_RED, 'important');
          nsp.call(s, '--focus-color-h', '0', 'important');
          nsp.call(s, '--focus-color-s', '100%', 'important');
          nsp.call(s, '--focus-color-l', '27%', 'important');
        }
        // Run repeatedly for first 5s to catch delayed React hydration
        var count = 0;
        var interval = setInterval(function () {
          forceVars();
          count++;
          if (count >= 50) clearInterval(interval);
        }, 100);
      })();
    </script>
